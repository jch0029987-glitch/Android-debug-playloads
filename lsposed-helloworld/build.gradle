buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    configurations.all {
        attributes {
            attribute(Attribute.of('com.android.build.api.attributes.BuildTypeAttr', String), 'debug')
            attribute(Attribute.of('org.jetbrains.kotlin.platform.type', String), 'androidJvm')
        }
    }
}
