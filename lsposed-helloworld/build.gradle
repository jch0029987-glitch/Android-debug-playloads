buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin('java-library') || project.plugins.hasPlugin('java')) {
            project.configurations {
                api {
                    outgoing {
                        attribute(Attribute.of('com.android.build.api.attributes.BuildTypeAttr', String), 'debug')
                        attribute(Attribute.of('org.jetbrains.kotlin.platform.type', String), 'androidJvm')
                        attribute(Attribute.of('com.android.build.api.attributes.AgpVersionAttr', String), '8.2.2')
                    }
                }
                implementation {
                    extendsFrom api
                }
            }
        }
    }
}
